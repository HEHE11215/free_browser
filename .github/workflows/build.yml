name: Build OpenWave Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: free_browser
        run: flutter pub get

      - name: Build OpenWave APK
        working-directory: free_browser
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWave-Android-APK
          path: free_browser/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
