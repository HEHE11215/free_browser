name: Build FreeBrowser APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Prepare Project
        run: |
          if [ -d "free_browser/lib" ]; then
            SRC_DIR="free_browser"
          else
            SRC_DIR="."
          fi
          echo "Using source: $SRC_DIR"

          flutter create app_builder --project-name free_browser --org com.freebrowser --platforms android
          rm -rf app_builder/lib
          cp -r "$SRC_DIR/lib" app_builder/lib

          cd app_builder
          flutter pub add flutter_inappwebview:^6.0.0
          flutter pub add cupertino_icons:^1.0.6

          echo "flutter.minSdkVersion=21" >> android/local.properties

          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd app_builder
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeBrowser-v1.0-Android-APK
          path: app_builder/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
