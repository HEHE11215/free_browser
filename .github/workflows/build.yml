name: 🚀 Build FreeBrowser APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: 🔨 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: 🏗️ Setup Project & Fix Gradle
        run: |
          # Detect whether source is inside free_browser/ or at root
          if [ -d "free_browser/lib" ]; then
            SRC_DIR="free_browser"
          else
            SRC_DIR="."
          fi

          echo "Using source folder: $SRC_DIR"

          # 1. Create fresh standard Flutter project
          flutter create app_builder \
            --project-name free_browser \
            --org com.freebrowser \
            --platforms android

          # 2. Copy our app files
          rm -rf app_builder/lib
          cp -r $SRC_DIR/lib app_builder/lib

          # 3. Write a clean pubspec.yaml with stable inappwebview
          cat > app_builder/pubspec.yaml << 'EOF'
name: free_browser
description: Ad-free YouTube browser with built-in uBlock-style ad blocker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
EOF

          # 4. Set minSdk to 21 directly in local.properties
          echo "flutter.minSdkVersion=21" >> app_builder/android/local.properties

          # 5. Configure AndroidManifest with permissions
          cat > app_builder/android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:label="FreeBrowser"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2"/>
              </application>
          </manifest>
          EOF

      - name: 📦 Build Release APK
        run: |
          cd app_builder
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeBrowser-v1.0-Android-APK
          path: app_builder/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
